<!doctype html>
<html lang="ja">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>見本3：広がりながら発明が進む</title>
    <style>:root{--bg:#0b0f1a;--line:#26324d;--text:#cfd8ee;--dim:#7d90b8;--gold:#ffe9a8}*{box-sizing:border-box}html,body{background:var(--bg);height:100%;color:var(--text);overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;margin:0;font-family:system-ui,-apple-system,Hiragino Sans,sans-serif;overflow:hidden}canvas{touch-action:none;width:100%;height:calc(100% - 132px);display:block;position:fixed;top:132px;left:0}#top{height:132px;padding:calc(env(safe-area-inset-top) + 8px) 14px 4px;font-size:12px;line-height:1.55;position:fixed;top:0;left:0;right:0}.row{color:var(--dim);justify-content:space-between;align-items:center;gap:6px;display:flex}.row b{color:var(--text)}button{color:var(--dim);border:1px solid var(--line);background:0 0;border-radius:12px;padding:4px 10px;font-size:12px}#bar{background:#141b2e;border-radius:3px;height:6px;margin:5px 0 4px;position:relative;overflow:hidden}#fill{background:var(--gold);width:0;position:absolute;top:0;bottom:0;left:0}#recipes{color:var(--text)}#recipes i{border-radius:50%;width:8px;height:8px;margin:0 2px 0 4px;font-style:normal;display:inline-block}#toast{color:#ffb4b4;opacity:0;pointer-events:none;background:#2a1c24;border:1px solid #5a3040;border-radius:16px;width:max-content;max-width:calc(100% - 32px);padding:7px 14px;font-size:13px;transition:opacity .3s;position:fixed;bottom:30px;left:50%;transform:translate(-50%)}#toast.show{opacity:1}#msg{text-align:center;color:var(--gold);opacity:0;pointer-events:none;text-shadow:0 0 8px #000;font-size:14px;transition:opacity .8s;position:fixed;top:140px;left:18px;right:18px}#msg.show{opacity:1}#end{text-align:center;background:#080b14e0;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:24px;font-size:13px;line-height:1.7;display:none;position:fixed;inset:0}#end.show{display:flex}#end h1{color:var(--gold);margin:0;font-size:20px;font-weight:500}</style>
    <script type="module" crossorigin src="./assets/tech-B6zz6Qv9.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">

  <body>
    <div id="top">
      <div class="row"><span>発明 <b id="inv"></b>　届いた都市 <b id="reach"></b></span><span><button id="pause">⏸</button> <button id="reset">はじめから</button></span></div>
      <div id="bar"><div id="fill"></div></div>
      <div id="recipes"></div>
      <div class="row"><span id="hint">泉からなぞって流す。線をタップで切る</span><span>線 <b id="left"></b>　<b id="t">0</b>秒</span></div>
    </div>
    <canvas id="c"></canvas>
    <div id="msg"></div>
    <div id="toast"></div>
    <div id="end"><h1>世界がひとつにむすばれた</h1><div id="endp"></div><button id="again">もう一度</button></div>
  </body>
