<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#070a12" />
    <title>Networking of Cities</title>
    <style>:root{--text:#cfd8ee;--dim:#7d90b8;--line:#26324d;--gold:#ffe9a8}*{box-sizing:border-box}html,body{height:100%;color:var(--text);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;background:#070a12;margin:0;font-family:system-ui,-apple-system,Hiragino Sans,sans-serif;overflow:hidden}canvas{touch-action:none;width:100%;height:100%;display:block;position:fixed;inset:0}#top{padding:calc(env(safe-area-inset-top) + 10px) 14px 0;pointer-events:none;justify-content:space-between;align-items:flex-start;font-size:13px;display:flex;position:fixed;top:0;left:0;right:0}#era{color:var(--text);letter-spacing:.08em;text-shadow:0 0 8px #000}#lines{color:var(--dim);letter-spacing:.2em;text-shadow:0 0 8px #000;margin-top:4px;font-size:15px}#lines b{color:var(--gold);font-weight:400}#btns{pointer-events:auto;flex-wrap:nowrap;gap:6px;display:flex;gap:3px!important}#btns button{white-space:nowrap;padding:5px 6px;font-size:10px}#era{white-space:nowrap}button{color:var(--dim);border:1px solid var(--line);background:#0c111eb3;border-radius:14px;padding:5px 11px;font-size:12px}#stack{left:14px;right:14px;top:calc(env(safe-area-inset-top) + 64px);pointer-events:none;flex-direction:column;gap:6px;display:flex;position:fixed}#msg{text-align:center;letter-spacing:.1em;color:var(--gold);opacity:0;pointer-events:none;text-shadow:0 0 10px #000;padding:0 4px;font-size:15px;transition:opacity 1.2s}#msg.show{opacity:1}#born{text-align:center;color:var(--text);opacity:0;pointer-events:none;text-shadow:0 0 8px #000;font-size:13px;transition:opacity .6s}#born.show{opacity:1}#born b{font-weight:600}#info{left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;color:var(--dim);text-shadow:0 0 6px #000,0 0 3px #000;-webkit-overflow-scrolling:touch;max-height:26vh;font-size:12px;line-height:1.6;position:fixed;overflow-y:auto}#info:empty{pointer-events:none}#info b{color:var(--text);font-weight:500}#toast{left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);color:var(--text);border:1px solid var(--line);opacity:0;pointer-events:none;background:#141b2ee6;border-radius:16px;width:max-content;max-width:calc(100% - 32px);padding:7px 14px;font-size:13px;transition:opacity .3s;position:fixed;transform:translate(-50%)}#toast.show{opacity:1}#flash{opacity:0;pointer-events:none;background:radial-gradient(circle,#fff6d8 0%,#ffe08a 40%,#ffe08a00 75%);position:fixed;inset:0}#flash.go{animation:2.2s ease-out flash}@keyframes flash{0%{opacity:0}8%{opacity:.85}to{opacity:0}}#clear{opacity:0;pointer-events:none;text-align:center;background:radial-gradient(circle at 50% 45%,#080c169e,#05080fdb);flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:0 22px;transition:opacity 1.2s;display:flex;position:fixed;inset:0}#clear.show{opacity:1;pointer-events:auto}.c-big{letter-spacing:.18em;color:var(--gold);text-shadow:0 0 18px #ffd36a,0 0 46px #ff9d3a,0 0 4px #fff;font-size:58px;font-weight:700;transition:transform 1.4s cubic-bezier(.2,1.6,.4,1);transform:scale(.6)}#clear.show .c-big{transform:scale(1)}.c-sub{letter-spacing:.12em;color:var(--text);text-shadow:0 0 10px #000;font-size:16px}#cStats{color:var(--dim);text-shadow:0 0 8px #000;margin-top:8px;font-size:13px;line-height:1.9}#cStats b{color:var(--text);font-weight:500}.c-btns{flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px;display:flex}.c-btns button{color:var(--text);background:#141b2eeb;border-radius:22px;padding:10px 18px;font-size:14px}#clearBadge{color:var(--gold)}#chron{-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 90px);background:#05080fe0;display:none;position:fixed;inset:0;overflow-y:auto}#chron.show{display:block}#chronBody{max-width:420px;margin:0 auto}#chron h2{color:var(--gold);letter-spacing:.1em;text-align:center;margin:6px 0 4px;font-size:17px;font-weight:500}#chron h3{color:var(--dim);letter-spacing:.15em;border-bottom:1px solid var(--line);margin:20px 0 6px;padding-bottom:4px;font-size:12px;font-weight:400}#chron .st{color:var(--dim);text-align:center;margin:4px 0;font-size:12px}#chron .row{justify-content:space-between;font-size:14px;line-height:1.9;display:flex}#chron .fx{color:var(--dim);margin:-4px 0 8px;font-size:12px}#chron .row i{color:var(--dim);font-size:12px;font-style:normal}body.rp #top,body.rp #stack,body.rp #info,body.rp #toast{opacity:0;pointer-events:none}#rp{display:none;position:fixed;inset:0}body.rp #rp{display:block}#rpBtns{left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 24px);justify-content:center;gap:10px;display:flex;position:absolute}#rpBtns button{color:var(--text);background:#141b2eeb;border-radius:22px;padding:10px 22px;font-size:14px}#chron .rbtn{color:var(--text);background:#141b2ef2;border-radius:22px;margin:14px auto 0;padding:10px 22px;font-size:14px;display:block}#chronClose{left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);color:var(--text);background:#141b2ef2;border-radius:22px;padding:10px 22px;font-size:14px;position:fixed;transform:translate(-50%)}</style>
    <script type="module" crossorigin src="./assets/index-tZLkseoN.js"></script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="top">
      <div><div id="era"></div><div id="lines"></div></div>
      <div id="btns"><button id="fine">細かい地図</button><button id="chronBtn">年表</button><button id="snd">🔊</button><button id="pause">⏸</button><button id="reset">はじめから</button></div>
    </div>
    <div id="stack"><div id="msg"></div><div id="born"></div></div>
    <div id="info"></div>
    <div id="toast"></div>
    <div id="flash"></div>
    <div id="clear"><div class="c-big">クリア！</div><div class="c-sub">世界は、ひとつの網になった</div><div id="cStats"></div><div class="c-btns"><button id="cReplay">夜明けを見返す</button><button id="cView">地球を眺める</button><button id="cChron">年表</button><button id="cAgain">もう一度</button></div></div>
    <div id="chron"><div id="chronBody"></div><button id="chronClose">地球を眺める</button></div>
    <div id="rp"><div id="rpBtns"><button id="rpAgain">もう一度</button><button id="rpClose">とじる</button></div></div>
  </body>
</html>
